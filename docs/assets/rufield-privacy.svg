<svg xmlns="http://www.w3.org/2000/svg" width="960" height="321" viewBox="0 0 960 321" role="img" aria-labelledby="title desc"><title id="title">RuField privacy classes</title><desc id="desc">Six privacy classes. Default live network projection permits P1 and P2; other classes are withheld. No numeric privacy ranking implies automatic release.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#15132e"/></linearGradient><linearGradient id="accent"><stop stop-color="#55edcb"/><stop offset="1" stop-color="#8d8cff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eff7ff}.muted{fill:#acc0d4}.eyebrow{fill:#55edcb;font-size:14px;letter-spacing:2px}.flow{stroke-dasharray:8 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-origin:752px 158px;animation:orbit 24s linear infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none!important}}</style><rect width="960" height="321" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="319" rx="19" fill="none" stroke="#314864"/><text x="32" y="40" font-size="14" class="eyebrow">PRIVACY / PUBLIC PROJECTION</text><text x="32" y="80" font-size="30" class="">Release only what the policy permits.</text><rect x="32" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="48" y="148" font-size="25" class="">P0</text><text x="48" y="187" font-size="15" class="muted">Raw signal</text><path class="pulse" d="M48 204h108" stroke="#8d8cff" stroke-width="2"/><rect x="186" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="202" y="148" font-size="25" class="">P1</text><text x="202" y="187" font-size="15" class="muted">Features</text><path class="pulse" d="M202 204h108" stroke="#55edcb" stroke-width="2"/><rect x="340" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="356" y="148" font-size="25" class="">P2</text><text x="356" y="187" font-size="15" class="muted">Occupancy</text><path class="pulse" d="M356 204h108" stroke="#55edcb" stroke-width="2"/><rect x="494" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="510" y="148" font-size="25" class="">P3</text><text x="510" y="187" font-size="15" class="muted">Aggregate</text><path class="pulse" d="M510 204h108" stroke="#8d8cff" stroke-width="2"/><rect x="648" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="664" y="148" font-size="25" class="">P4</text><text x="664" y="187" font-size="15" class="muted">Biometric</text><path class="pulse" d="M664 204h108" stroke="#8d8cff" stroke-width="2"/><rect x="802" y="112" width="140" height="101" rx="14" fill="#102438" stroke="#314864"/><text x="818" y="148" font-size="25" class="">P5</text><text x="818" y="187" font-size="15" class="muted">Identity</text><path class="pulse" d="M818 204h108" stroke="#8d8cff" stroke-width="2"/><text x="32" y="255" font-size="16" class="">Default live projection: P1 / P2 only; identifiers and provenance internals are redacted.</text><text x="32" y="289" font-size="16" class="muted">P0 stays at the edge. P4 requires consent. P5 requires identity binding and audit.</text></svg>
