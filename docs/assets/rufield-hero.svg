<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">RuField: many signals, one field of evidence</title><desc id="desc">An animated sensing constellation illustrates the common event model. Conceptual artwork, not measured data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#15132e"/></linearGradient><linearGradient id="accent"><stop stop-color="#55edcb"/><stop offset="1" stop-color="#8d8cff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eff7ff}.muted{fill:#acc0d4}.eyebrow{fill:#55edcb;font-size:14px;letter-spacing:2px}.flow{stroke-dasharray:8 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-origin:752px 158px;animation:orbit 24s linear infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none!important}}</style><rect width="960" height="360" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="358" rx="19" fill="none" stroke="#314864"/><path d="M0 0v360" stroke="#31536a" opacity=".14"/><path d="M40 0v360" stroke="#31536a" opacity=".14"/><path d="M80 0v360" stroke="#31536a" opacity=".14"/><path d="M120 0v360" stroke="#31536a" opacity=".14"/><path d="M160 0v360" stroke="#31536a" opacity=".14"/><path d="M200 0v360" stroke="#31536a" opacity=".14"/><path d="M240 0v360" stroke="#31536a" opacity=".14"/><path d="M280 0v360" stroke="#31536a" opacity=".14"/><path d="M320 0v360" stroke="#31536a" opacity=".14"/><path d="M360 0v360" stroke="#31536a" opacity=".14"/><path d="M400 0v360" stroke="#31536a" opacity=".14"/><path d="M440 0v360" stroke="#31536a" opacity=".14"/><path d="M480 0v360" stroke="#31536a" opacity=".14"/><path d="M520 0v360" stroke="#31536a" opacity=".14"/><path d="M560 0v360" stroke="#31536a" opacity=".14"/><path d="M600 0v360" stroke="#31536a" opacity=".14"/><path d="M640 0v360" stroke="#31536a" opacity=".14"/><path d="M680 0v360" stroke="#31536a" opacity=".14"/><path d="M720 0v360" stroke="#31536a" opacity=".14"/><path d="M760 0v360" stroke="#31536a" opacity=".14"/><path d="M800 0v360" stroke="#31536a" opacity=".14"/><path d="M840 0v360" stroke="#31536a" opacity=".14"/><path d="M880 0v360" stroke="#31536a" opacity=".14"/><path d="M920 0v360" stroke="#31536a" opacity=".14"/><text x="36" y="42" font-size="14" class="eyebrow">RUFIELD / MULTIMODAL FIELD SENSING</text><text x="36" y="102" font-size="44" class="">Many signals.</text><text x="36" y="155" font-size="40" class="">One field of evidence.</text><text x="36" y="202" font-size="21" class="muted">Camera-free sensing with trust built in.</text><rect x="36" y="242" width="154" height="40" rx="14" fill="#102438" stroke="#314864"/><text x="54" y="268" font-size="14" class="">NORMALIZE</text><rect x="208" y="242" width="154" height="40" rx="14" fill="#102438" stroke="#314864"/><text x="226" y="268" font-size="14" class="">VERIFY</text><rect x="380" y="242" width="154" height="40" rx="14" fill="#102438" stroke="#314864"/><text x="398" y="268" font-size="14" class="">FUSE</text><text x="36" y="328" font-size="16" class="muted">Synthetic ≠ captured replay ≠ validated physical accuracy</text><circle cx="752" cy="158" r="45" fill="none" stroke="#55edcb" opacity=".25"/><circle cx="752" cy="158" r="83" fill="none" stroke="#55edcb" opacity=".25"/><circle cx="752" cy="158" r="124" fill="none" stroke="#55edcb" opacity=".25"/><g class="orbit"><path d="M752 158L876.00 158.00" stroke="#8d8cff" opacity=".45"/><circle cx="876.00" cy="158.00" r="6" fill="#55edcb"/><path d="M752 158L814.00 265.39" stroke="#8d8cff" opacity=".45"/><circle cx="814.00" cy="265.39" r="6" fill="#55edcb"/><path d="M752 158L690.00 265.39" stroke="#8d8cff" opacity=".45"/><circle cx="690.00" cy="265.39" r="6" fill="#55edcb"/><path d="M752 158L628.00 158.00" stroke="#8d8cff" opacity=".45"/><circle cx="628.00" cy="158.00" r="6" fill="#55edcb"/><path d="M752 158L690.00 50.61" stroke="#8d8cff" opacity=".45"/><circle cx="690.00" cy="50.61" r="6" fill="#55edcb"/><path d="M752 158L814.00 50.61" stroke="#8d8cff" opacity=".45"/><circle cx="814.00" cy="50.61" r="6" fill="#55edcb"/></g><circle class="pulse" cx="752" cy="158" r="34" fill="#193e51" stroke="#55edcb"/><text x="731" y="164" font-size="18" class="">MFS</text><text x="673" y="308" font-size="16" class="">Events → inferences</text></svg>
