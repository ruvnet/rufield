<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" role="img" aria-labelledby="title desc"><title id="title">RuField evidence pipeline</title><desc id="desc">Adapters normalize events; trust and privacy policies govern fusion. Production keys must be independently enrolled.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#15132e"/></linearGradient><linearGradient id="accent"><stop stop-color="#55edcb"/><stop offset="1" stop-color="#8d8cff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eff7ff}.muted{fill:#acc0d4}.eyebrow{fill:#55edcb;font-size:14px;letter-spacing:2px}.flow{stroke-dasharray:8 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-origin:752px 158px;animation:orbit 24s linear infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none!important}}</style><rect width="960" height="336" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="334" rx="19" fill="none" stroke="#314864"/><text x="32" y="40" font-size="14" class="eyebrow">THE REFERENCE PIPELINE</text><text x="32" y="80" font-size="29" class="">Evidence must pass before state changes.</text><rect x="32" y="112" width="204" height="119" rx="14" fill="#102438" stroke="#314864"/><text x="46" y="142" font-size="14" class="eyebrow">01 / ADAPT</text><text x="46" y="179" font-size="20" class="">Sensor inputs</text><text x="46" y="211" font-size="14" class="muted">Real + synthetic paths</text><path class="flow" d="M236 170h28" stroke="#55edcb" stroke-width="2"/><rect x="264" y="112" width="204" height="119" rx="14" fill="#102438" stroke="#314864"/><text x="278" y="142" font-size="14" class="eyebrow">02 / NORMALIZE</text><text x="278" y="179" font-size="20" class="">FieldEvent</text><text x="278" y="211" font-size="14" class="muted">Common data model</text><path class="flow" d="M468 170h28" stroke="#55edcb" stroke-width="2"/><rect x="496" y="112" width="204" height="119" rx="14" fill="#102438" stroke="#314864"/><text x="510" y="142" font-size="14" class="eyebrow">03 / AUTHORIZE</text><text x="510" y="179" font-size="20" class="">Trust + privacy</text><text x="510" y="211" font-size="14" class="muted">Policy controls</text><path class="flow" d="M700 170h28" stroke="#55edcb" stroke-width="2"/><rect x="728" y="112" width="204" height="119" rx="14" fill="#102438" stroke="#314864"/><text x="742" y="142" font-size="14" class="eyebrow">04 / FUSE</text><text x="742" y="179" font-size="20" class="">FieldInference</text><text x="742" y="211" font-size="14" class="muted">Confidence + expiry</text><text x="32" y="272" font-size="16" class="">Simulation: explicit synthetic evidence. Production: independently enrolled sensor keys.</text><text x="32" y="307" font-size="15" class="muted">Rejected input never becomes trusted evidence simply because a signature is present.</text></svg>
