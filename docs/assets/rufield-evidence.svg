<svg xmlns="http://www.w3.org/2000/svg" width="960" height="337" viewBox="0 0 960 337" role="img" aria-labelledby="title desc"><title id="title">RuField evidence modes</title><desc id="desc">Synthetic demonstrations, captured replay and production each have distinct trust and evidence requirements.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#15132e"/></linearGradient><linearGradient id="accent"><stop stop-color="#55edcb"/><stop offset="1" stop-color="#8d8cff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eff7ff}.muted{fill:#acc0d4}.eyebrow{fill:#55edcb;font-size:14px;letter-spacing:2px}.flow{stroke-dasharray:8 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-origin:752px 158px;animation:orbit 24s linear infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{50%{opacity:.35}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit{animation:none!important}}</style><rect width="960" height="337" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="335" rx="19" fill="none" stroke="#314864"/><text x="32" y="40" font-size="14" class="eyebrow">EVIDENCE / HONEST CLAIMS</text><text x="32" y="80" font-size="30" class="">Three modes. Three different claims.</text><rect x="32" y="112" width="280" height="156" rx="14" fill="#102438" stroke="#314864"/><text x="48" y="143" font-size="14" class="eyebrow">SYNTHETIC</text><text x="48" y="183" font-size="19" class="">Deterministic simulator</text><text x="48" y="216" font-size="16" class="">Pipeline conformance</text><text x="48" y="246" font-size="14" class="muted">Not physical accuracy</text><rect x="340" y="112" width="280" height="156" rx="14" fill="#102438" stroke="#314864"/><text x="356" y="143" font-size="14" class="eyebrow">CAPTURED REPLAY</text><text x="356" y="183" font-size="19" class="">Recorded measurements</text><text x="356" y="216" font-size="16" class="">Replay + trust checks</text><text x="356" y="246" font-size="14" class="muted">Labels determine validity</text><rect x="648" y="112" width="280" height="156" rx="14" fill="#102438" stroke="#314864"/><text x="664" y="143" font-size="14" class="eyebrow">PRODUCTION</text><text x="664" y="183" font-size="19" class="">Enrolled live sensors</text><text x="664" y="216" font-size="16" class="">Freshness + replay defense</text><text x="664" y="246" font-size="14" class="muted">Field validation still needed</text><text x="32" y="309" font-size="15" class="muted">A working demo is evidence of a working demo. Promote claims only with verified artifacts.</text></svg>
