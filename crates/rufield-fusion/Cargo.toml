[package]
name = "rufield-fusion"
version.workspace = true
readme = "README.md"
edition.workspace = true
description = "RuField MFS fusion graph + engine: TOML rules, weighted-Bayes / temporal-window inference, confidence decay (ADR-260 §12/§13/§24)"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["sensing", "fusion", "inference", "bayes"]
categories = ["science"]

[dependencies]
rufield-core = { workspace = true }
rufield-provenance = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Path-only (no version): stripped at `cargo publish`, breaking the
# fusion <-> adapters circular dev-dependency so fusion can publish
# without rufield-adapters existing on crates.io.
rufield-adapters = { path = "../rufield-adapters" }

[lints]
workspace = true
